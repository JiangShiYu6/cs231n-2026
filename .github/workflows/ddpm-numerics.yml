name: DDPM reference diagnostics (not a passing-test verdict)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-reference:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy==1.26.4 einops==0.8.1
      - run: python assignment3/tests/check_ddpm_references.py --diagnostic
      - name: Report actual reference-check verdicts
        run: |
          python - <<'PY'
          import json, os
          report = json.load(open('assignment3/ddpm_reference_report.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Diagnostic collection success does not mean numerical checks passed.\n\n')
              for result in report['results']:
                  verdict = 'PASS' if result['passed'] else 'FAIL'
                  summary.write(f"- {verdict}: cell {result['cell']}, threads={result['threads']}, "
                                f"mkldnn={result['mkldnn']}, relative error={result['relative_error']:.8g}, "
                                f"threshold={result['threshold']}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ddpm-reference-report
          path: assignment3/ddpm_reference_report.json
